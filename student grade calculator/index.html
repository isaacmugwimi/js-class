<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section>
      <div class="container">
        <h1>Student Grade Calculator</h1>

        <label for=""> Student Name</label>
        <input type="text" id="name" />

        <label for=""> Maths</label>
        <input type="number" name="" id="math" />

        <label for=""> English</label>
        <input type="number" name="" id="english" />

        <label for=""> Science</label>
        <input type="number" name="" id="science" />

        <button id="calculateBtn">Calculate Result</button>
      </div>

      <div class="result">
        <h2>Result</h2>
        <p>Student: <span id="studentName">---</span></p>
        <p>Average: <span id="average">---</span></p>
        <p>Grade: <span id="grade">---</span></p>
      </div>
    </section>
    <script src="script.js"></script>
  </body>
</html>
